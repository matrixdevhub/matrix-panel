services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matrix_panel
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matrix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix_panel"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  matrix_pgdata:
