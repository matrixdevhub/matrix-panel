name: Matrix Panel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate installer syntax
        run: bash -n scripts/install.sh
      - name: Install dependencies
        run: npm install
      - name: Type-check API and web
        run: npm run typecheck
      - name: Build API and web
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: matrix-panel-build
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/api/dist/
            apps/web/dist/
            apps/api/package.json
            apps/web/package.json
            package.json
            deploy/nginx/matrix-panel.conf.example
            deploy/systemd/matrix-panel-api.service.example
            .env.example
            scripts/install.sh
            docs/DEPLOYMENT.md
